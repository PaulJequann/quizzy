<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>Quizzy Offline</title>
    <style>
      :root {
        --bg: #faf8f4;
        --surface: #fffdf9;
        --border: #e7e1d6;
        --text: #2a2723;
        --muted: #6b655b;
        --accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.55;
      }

      main {
        width: min(100%, 28rem);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--surface);
        padding: 1.5rem;
        box-shadow: 0 1px 2px rgba(42, 39, 35, 0.05), 0 4px 16px rgba(42, 39, 35, 0.04);
      }

      .mark {
        display: grid;
        width: 3rem;
        height: 3rem;
        place-items: center;
        border-radius: 0.65rem;
        background: #e8f3f1;
        color: var(--accent);
        font-size: 1.45rem;
        font-weight: 700;
      }

      h1 {
        margin: 1rem 0 0;
        font-size: 1.55rem;
        line-height: 1.2;
      }

      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">Q</div>
      <h1>Quizzy needs a connection.</h1>
      <p>Reconnect to keep taking quizzes, submit answers, and update mastery.</p>
    </main>
  </body>
</html>
