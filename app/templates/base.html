<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Quizzy{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=fraunces:500,600,600i,700|source-sans-3:400,500,600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}?v=20260614-subject-mastery-layout">
  </head>
  <body class="{% block body_class %}min-h-screen bg-[var(--color-bg)] text-[var(--color-text)]{% endblock %}">
    {% block site_header %}
    <header class="border-b border-[var(--color-border)] bg-[var(--color-surface)]">
      <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 sm:px-6">
        <a href="/quizzes" class="flex items-center gap-3">
          <span class="font-display grid size-9 place-items-center rounded-lg bg-[var(--color-accent-subtle)] text-xl text-[var(--color-accent-text)]">Q</span>
          <span>
            <span class="font-display block text-xl leading-none">Quizzy</span>
            <span class="eyebrow block">study drills</span>
          </span>
        </a>
        <div class="flex items-center gap-2">
          <a class="btn-secondary" href="/subjects">Subjects</a>
          <a class="btn-secondary" href="/quizzes">Quizzes</a>
          <a class="btn-secondary" href="/mastery">Mastery</a>
          <a class="btn-primary" href="/quizzes/new">Practice</a>
        </div>
      </nav>
    </header>
    {% endblock %}
    <main class="{% block main_class %}mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:py-10{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
