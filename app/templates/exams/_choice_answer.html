<h2 class="font-semibold">{{ number }}. {{ answer.question }}</h2>
<p class="mt-3">{{ answer_label }}: {{ answer.selected_choice or "No answer" }}</p>
<p class="mt-1">Correct answer: {{ answer.correct_choice }}</p>
<p class="mt-1 font-semibold">{% if answer.is_correct %}Correct{% else %}Incorrect{% endif %}</p>
{% if answer.explanation %}<p class="mt-3 leading-7 text-[var(--color-text-2)]">{{ answer.explanation }}</p>{% endif %}
