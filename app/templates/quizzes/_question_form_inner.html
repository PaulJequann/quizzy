<div class="mb-5">
  <p class="eyebrow">Manual authoring</p>
  <h1 class="section-title">Add a multiple-choice question</h1>
  <p class="mt-2 text-sm text-[var(--color-text-2)]">Four choices, one correct answer, optional explanation and source reference.</p>
</div>
{% if error %}
  <div class="mb-4 rounded-lg border border-[var(--color-error)] bg-[var(--color-error-subtle)] px-4 py-3 text-sm font-medium text-[var(--color-error-text)]">{{ error }}</div>
{% endif %}
<form
  class="space-y-5"
  method="post"
  action="/quizzes/{{ quiz.id }}/questions"
  hx-post="/quizzes/{{ quiz.id }}/questions"
  hx-target="#question-workspace"
  hx-swap="outerHTML"
>
  <label class="field-label">
    Question text
    <textarea class="field min-h-28" name="stem" required></textarea>
  </label>
  <div class="grid gap-4 sm:grid-cols-2">
    {% for index in range(1, 5) %}
      <label class="field-label">
        Choice {{ index }}
        <input class="field" name="choice_{{ index }}" required>
      </label>
    {% endfor %}
  </div>
  <fieldset>
    <legend class="field-label mb-2">Correct answer</legend>
    <div class="grid gap-2 sm:grid-cols-4">
      {% for index in range(0, 4) %}
        <label class="radio-tile">
          <input type="radio" name="correct_choice" value="{{ index }}" required {% if loop.first %}checked{% endif %}>
          <span>{{ loop.index }}</span>
        </label>
      {% endfor %}
    </div>
  </fieldset>
  <label class="field-label">
    Explanation
    <textarea class="field min-h-20" name="explanation"></textarea>
  </label>
  <label class="field-label">
    Source reference
    <input class="field" name="source_reference" placeholder="vault/path.md#heading">
  </label>
  <label class="field-label">
    Concepts
    <input class="field" name="concepts" placeholder="S3 storage, IAM policies, security groups">
  </label>
  <div class="flex flex-wrap gap-3">
    <button class="btn-primary" type="submit">Add question</button>
    <a class="btn-secondary" href="/quizzes/{{ quiz.id }}">Done</a>
  </div>
</form>
