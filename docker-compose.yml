services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quizzy
      POSTGRES_USER: quizzy
      POSTGRES_PASSWORD: quizzy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizzy -d quizzy"]
      interval: 5s
      timeout: 5s
      retries: 8

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://quizzy:quizzy@db:5432/quizzy
      APP_ENV: development
      SECRET_KEY: change-me
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

